# Local testing only. Run with: pnpm nginx:local (prefix is the project root).
daemon off;
pid nginx/temp/nginx.pid;
error_log /dev/stderr;

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
}

http {
  # Per-request logging is off so load tests are not slowed down.
  access_log off;

  upstream api {
    server 127.0.0.1:3000;
    keepalive 256;
  }

  client_body_temp_path nginx/temp/client_body;
  proxy_temp_path nginx/temp/proxy;
  fastcgi_temp_path nginx/temp/fastcgi;
  uwsgi_temp_path nginx/temp/uwsgi;
  scgi_temp_path nginx/temp/scgi;

  gzip on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types application/json text/plain text/css application/javascript;

  server {
    listen 127.0.0.1:8080;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
